- id: ai-fluency/llm-wiki-knowledge-compounding
  gap: AI technical fluency
  concept: "The LLM Wiki pattern: pre-compile knowledge once at ingest-time rather than re-derive on every query"
  difficulty: hard
  source:
    - url: sources/AI PM Knowledge Store & Deep Multi-Hop Extraction Plan.md
      type: report
      accessed_at: 2026-08-01
      anchor: "The LLM Wiki pattern inverts this relationship by shifting the computational cost from query-time to compile-time. Operating under a compiler analogy, the large language model incrementally builds and maintains a structured, interlinked collection of markdown files"
    - url: https://blog.starmorph.com/blog/karpathy-llm-wiki-knowledge-base-guide
      type: blog
      accessed_at: 2026-08-01
      anchor: "An LLM Wiki is stateful — knowledge compounds over time. RAG is stateless — each query starts fresh."
    - url: https://www.kunalganglani.com/blog/llm-wiki-karpathy-local-knowledge-base
      type: blog
      accessed_at: 2026-08-01
      anchor: "The LLM Wiki compiles knowledge at ingestion time into structured wiki pages with explicit cross-references."
    - url: https://atlan.com/know/llm-wiki-vs-rag-knowledge-base/
      type: blog
      accessed_at: 2026-08-01
      anchor: "Andrej Karpathy proposed a personal knowledge base using three markdown folders: raw/ for source material, wiki/ for LLM-compiled summary articles, and index.md as a master map"
    - url: https://www.epsilla.com/blogs/llm-wiki-kills-rag-karpathy-enterprise-semantic-graph
      type: blog
      accessed_at: 2026-08-01
      anchor: "uses an LLM not to index, but to compile this raw material into a structured, interconnected, and self-healing Wiki of Markdown files"
    - url: sources/README.md
      type: docs
      accessed_at: 2026-08-01
      anchor: "karpathy-llm-wiki.md              ← Karpathy's LLM Wiki idea doc (primary for concept node #10)"
    - url: sources/karpathy-llm-wiki.md
      type: blog
      accessed_at: 2026-08-01
      anchor: "Instead of just retrieving from raw documents at query time, the LLM incrementally builds and maintains a persistent wiki — a structured, interlinked collection of markdown files that sits between you and the raw sources."
    - url: sources/linkedin_resources/MASTER_INDEX.md
      type: blog
      accessed_at: 2026-08-01
      anchor: "Karpathy: agents as new distribution channel — MCP adoption, CLI as legacy, product discovery"
