- id: ai-fluency/rag-fundamentals
  gap: AI technical fluency
  concept: "How RAG works: retrieve relevant chunks from external storage, augment the prompt, generate grounded responses"
  difficulty: medium
  source:
    - url: sources/AI PM Knowledge Store & Deep Multi-Hop Extraction Plan.md
      type: report
      accessed_at: 2026-08-01
      anchor: "Retrieval-Augmented Generation is the superior strategy for maintaining factual integrity and clinical safety. RAG significantly reduces hallucination rates by dynamically accessing up-to-date, external knowledge sources at inference time"
    - url: https://blog.starmorph.com/blog/karpathy-llm-wiki-knowledge-base-guide
      type: blog
      accessed_at: 2026-08-01
      anchor: "RAG (Retrieval-Augmented Generation) retrieves relevant document chunks at query time using vector embeddings."
    - url: https://www.kunalganglani.com/blog/llm-wiki-karpathy-local-knowledge-base
      type: blog
      accessed_at: 2026-08-01
      anchor: "RAG retrieves raw document chunks at query time and synthesizes an answer from scratch each time."
    - url: https://atlan.com/know/llm-wiki-vs-rag-knowledge-base/
      type: blog
      accessed_at: 2026-08-01
      anchor: "RAG outperforms on large, dynamic, multi-user corpora where the knowledge base exceeds context window limits"
    - url: https://www.epsilla.com/blogs/llm-wiki-kills-rag-karpathy-enterprise-semantic-graph
      type: blog
      accessed_at: 2026-08-01
      anchor: "chop documents into arbitrary chunks, convert them into mathematical vectors, and store them in a specialized database"
    - url: sources/GenerativeAICourse/lessons/07_prompt_engineering.md
      type: pasted
      accessed_at: 2026-08-01
      anchor: "We create embeddings from our data, store them in vector database. Semantic search is done by taking in the prompt and comparing it with the embeddings"
    - url: sources/GenerativeAICourse/lessons/09_RAG.md
      type: docs
      accessed_at: 2026-08-01
      anchor: "RAG is literally building a function, where when user asks a question, we turn the question into vectors, compare it with vectors in our vector database, then once we find the relevant vectors, we add it to the question with the prompt."
    - url: sources/GenerativeAICourse/lessons/11_Agents.md
      type: docs
      accessed_at: 2026-08-01
      anchor: "Memory: This is fundamental software engineering. We've explored solutions like RAG and long context windows, and there's ongoing development like Talk agents."
