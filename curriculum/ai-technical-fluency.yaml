- id: ai-fluency/long-context-vs-rag
  gap: AI technical fluency
  concept: "When expanding context windows eliminates the need for RAG versus when retrieval-based systems remain superior"
  difficulty: hard
  source:
    - url: sources/AI PM Knowledge Store & Deep Multi-Hop Extraction Plan.md
      type: report
      accessed_at: 2026-08-01
      anchor: "Below the threshold of 50,000 to 100,000 tokens, the LLM Wiki approach is vastly superior in token efficiency, potentially cutting token usage by up to 95% compared to loading all source documents into context at query time"
    - url: https://blog.starmorph.com/blog/karpathy-llm-wiki-knowledge-base-guide
      type: blog
      accessed_at: 2026-08-01
      anchor: "RAG requires vector databases and embedding pipelines; an LLM Wiki requires only a folder of markdown files."
    - url: https://www.kunalganglani.com/blog/llm-wiki-karpathy-local-knowledge-base
      type: blog
      accessed_at: 2026-08-01
      anchor: "RAG is stateless; the LLM Wiki is a persistent, compounding artifact that gets richer with every source you add."
    - url: https://atlan.com/know/llm-wiki-vs-rag-knowledge-base/
      type: blog
      accessed_at: 2026-08-01
      anchor: "Neither is universally better. LLM wikis outperform RAG on token efficiency and simplicity for small, stable, personal-scale knowledge bases below roughly 100-200 articles and 50,000-100,000 tokens."
