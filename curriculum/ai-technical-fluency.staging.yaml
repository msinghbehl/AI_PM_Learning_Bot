- id: ai-fluency/long-context-vs-rag
  gap: AI technical fluency
  concept: "When long context windows make RAG unnecessary versus when RAG or LLM Wiki patterns are still required for large-scale knowledge"
  difficulty: hard
  source:
    - url: https://blog.starmorph.com/blog/karpathy-llm-wiki-knowledge-base-guide
      type: blog
      accessed_at: 2026-07-27
      anchor: "RAG requires vector databases and embedding pipelines; an LLM Wiki requires only a folder of markdown files."
    - url: https://www.kunalganglani.com/blog/llm-wiki-karpathy-local-knowledge-base
      type: blog
      accessed_at: 2026-07-27
      anchor: "The fix is a master index file that lists every page with a one-line summary. You instruct the agent to read the index first, then selectively load only the pages it needs for a given update."
    - url: https://atlan.com/know/llm-wiki-vs-rag-knowledge-base/
      type: blog
      accessed_at: 2026-07-27
      anchor: "Use a vector database when your knowledge corpus exceeds roughly 50,000-100,000 tokens, when content updates frequently, or when multiple users need concurrent access."
    - url: sources/GenerativeAICourse/lessons/09_RAG.md
      type: pasted
      accessed_at: 2026-07-27
      anchor: "There is a limitation on the context window, and if the data exceeds that, which in most cases it will, then we divide it into chunks"
    - url: sources/karpathy-llm-wiki.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "the LLM is rediscovering knowledge from scratch on every question. There's no accumulation. Ask a subtle question that requires synthesizing five documents, and the LLM has to find and piece together the relevant fragments every time."
    - url: https://deepmind.google/models/gemini/
      type: model-card
      accessed_at: 2026-07-27
      anchor: "GDM-MRCR v2 (8-needle) Long context performance | 128k (average) | 91.8% | 77.3% | 84.9% | 74.8% | 81.4% | 71.6% | 1M (pointwise) | 54.0% | 26.6% | 26.3%"
    - url: https://openai.com/research/gpt-4
      type: report
      accessed_at: 2026-07-27
      anchor: "gpt-4 has a context length of 8,192 tokens. We are also providing limited access to our 32,768–context (about 50 pages of text) version, gpt-4-32k"
