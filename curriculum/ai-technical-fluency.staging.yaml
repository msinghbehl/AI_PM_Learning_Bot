- id: ai-fluency/agents-and-mcp
  gap: AI technical fluency
  concept: "AI agents — LLMs as decision-making engines that take actions independently — and MCP (Model Context Protocol), the standardized communication layer that decouples agents from tools the way REST decoupled web frontends from databases"
  difficulty: medium
  source:
    - url: sources/GenerativeAICourse/lessons/11_Agents.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "an AI agent is simply an application that uses an LLM as its decision making engine to execute actions independently. The key word is independently"
    - url: sources/GenerativeAICourse/lessons/11_Agents.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "MCP (Model Context Protocol): You need agents to take actions, which means they have to communicate with other systems. MCP is like HTTP for AI agents — it provides a standardized way for agents to interact with different services and tools"
    - url: sources/GenerativeAICourse/lessons/11_Agents.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "The difference between function calling and tools, is that tools are the actual implementation (like the python functions that do the work) while function calling is the LLM's ability to tell your app \"I need access to the weather function\""
    - url: sources/GenerativeAICourse/lessons/13_MCP.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "MCP is a communication protocol that standardizes how your AI applications interact with external tools and data sources."
    - url: sources/GenerativeAICourse/lessons/13_MCP.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "MCP introduced a standardized communication layer between AI applications and tools following the same architectural pattern that API servers provide between web frontends and databases."
    - url: sources/GenerativeAICourse/lessons/13_MCP.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "Agent ↔ MCP Server ↔ Tools (decoupled, flexible)"
    - url: sources/GenerativeAICourse/lessons/13_MCP.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "MCP for AI is like REST APIs for AI tools. It provides the same standardization and decoupling benefits that web APIs brought to web development."
    - url: sources/GenerativeAICourse/lessons/11_Agents.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "When workflows require judgement calls that can't be captured in rules."
    - url: sources/GenerativeAICourse/lessons/11_Agents.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "Agents of course cost more per operation than traditional automation, but they eliminate the human labor required for complex decisions."
  related_gaps: []
