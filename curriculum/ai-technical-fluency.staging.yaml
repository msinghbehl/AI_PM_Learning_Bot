- id: ai-fluency/llm-wiki-knowledge-compounding
  gap: AI technical fluency
  concept: "LLM Wiki pattern — pre-compiling knowledge into structured markdown with cross-references instead of stateless retrieval per query, enabling knowledge to compound over time"
  difficulty: medium
  source:
    - url: https://blog.starmorph.com/blog/karpathy-llm-wiki-knowledge-base-guide
      type: blog
      accessed_at: 2026-07-27
      anchor: "An LLM Wiki pre-compiles knowledge into structured markdown pages with cross-references and summaries, so the LLM navigates an index instead of searching embeddings. RAG is stateless — each query starts fresh. An LLM Wiki is stateful — knowledge compounds over time."
    - url: https://www.kunalganglani.com/blog/llm-wiki-karpathy-local-knowledge-base
      type: blog
      accessed_at: 2026-07-27
      anchor: "Instead of retrieving document chunks on every query like RAG, an LLM agent compiles your source material into interlinked markdown files that form a persistent, growing wiki."
    - url: https://atlan.com/know/llm-wiki-vs-rag-knowledge-base/
      type: blog
      accessed_at: 2026-07-27
      anchor: "Andrej Karpathy proposed a personal knowledge base using three markdown folders: raw/ for source material, wiki/ for LLM-compiled summary articles, and index.md as a master map sized to fit within the model's context window."
    - url: https://www.epsilla.com/blogs/llm-wiki-kills-rag-karpathy-enterprise-semantic-graph
      type: blog
      accessed_at: 2026-07-27
      anchor: "uses an LLM not to index, but to compile this raw material into a structured, interconnected, and self-healing Wiki of Markdown files"
    - url: sources/karpathy-llm-wiki.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "the LLM **incrementally builds and maintains a persistent wiki** — a structured, interlinked collection of markdown files that sits between you and the raw sources"
    - url: sources/karpathy-llm-wiki.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "the wiki is a persistent, compounding artifact. The cross-references are already there. The contradictions have already been flagged. The synthesis already reflects everything you've read."
    - url: sources/karpathy-llm-wiki.md
      type: docs
      accessed_at: 2026-07-27
      anchor: "Obsidian is the IDE; the LLM is the programmer; the wiki is the codebase."
  related_gaps: []
  prerequisites: [ai-fluency/rag-fundamentals]
  challenge_types: [concept-recall, scenario, technical-deep-dive]
  phase: 1
